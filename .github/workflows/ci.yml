name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Curses on ubuntu-latest does not emit terminfo `rep`, which a TUI test relies on.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
      - run: uvx ruff format --check src tests
      - run: uvx ruff check src tests
      - run: uv lock --check
      - run: uv run pytest -q

  # mise resolves versions from GitHub releases, so a push to main ships only once
  # the release for the version in pyproject.toml exists.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          init_version=$(PYTHONPATH=src python3 -c "import mobile_broom; print(mobile_broom.__version__)")
          tag="v$version"
          if [ "$version" != "$init_version" ]; then
            echo "::error::pyproject.toml has $version but __version__ is $init_version."
            exit 1
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            # BEFORE is all zeros for a new branch and may be unreachable after a force push.
            if ! git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
              echo "::warning::Cannot read $BEFORE, so src/ was not checked for a missing bump."
            elif ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- src; then
              echo "::error::src/ changed, but $tag is already released. Bump the version."
              exit 1
            fi
            echo "::warning::$tag is already released. Nothing to release."
            exit 0
          fi

          latest=$(gh release list --limit 1000 --exclude-drafts --json tagName --jq '.[].tagName' | sort -V | tail -n 1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -n 1)" != "$tag" ]; then
            echo "::error::$tag is not newer than the latest release $latest."
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "::notice::Tag $tag exists without a release. Releasing the existing tag."
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
